[project]
name = "docling-test"
version = "0.1.0"
description = "GNP insurance policy PDF extraction pipeline."
requires-python = ">=3.14"
dependencies = [
    "docling",
    "jsonschema",
    "ollama",
    "pymupdf",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
